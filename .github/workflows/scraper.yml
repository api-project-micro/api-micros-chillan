name: Actualizador de Horarios de Micros

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 8:00 AM (opcional)

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: 4. Ejecutar Scraper
        run: python scraper.py

      - name: 5. Guardar capturas de depuración si falla
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-debug
          path: debug_*.png

      - name: 6. Guardar el JSON actualizado en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horarios_micros.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de horarios [skip ci]" && git push)
